name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --legacy-peer-deps
      - run: rm -rf android && npx expo prebuild --platform android --non-interactive --no-install
      - run: rm -f android/app/src/main/res/values/splash_colors.xml
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Money-Management-FINAL-NO-CRASH
          path: android/app/build/outputs/apk/debug/app-debug.apk
